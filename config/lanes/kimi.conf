# Dispatch-spec v2 lane defaults for the kimi coding lane.
# Flat KEY=VALUE, parsed by the kimi runner's _invoke_kimi method.
#
# model: effective model alias (from config.toml [models."kimi-code/<alias>"])
# fallback: comma-separated model aliases to try if the primary fails
# max_turns: max assistant-content events before cap_exceeded
# timeout: per-node wall-clock timeout in seconds (overrides plugin default)
#
# Model aliases available on this machine (from ~/.kimi-code/config.toml):
#   kimi-code/k3          — 1M context, best for large codebase analysis
#   kimi-code/k3-256k     — 256k context, everyday Q&A and routine dev
#   kimi-code/kimi-for-coding       — K2.7 Coding (all members)
#   kimi-code/kimi-for-coding-highspeed  — K2.7 HighSpeed (Allegretto+)
model=kimi-code/k3-256k
fallback=kimi-code/kimi-for-coding, kimi-code/kimi-for-coding-highspeed
max_turns=50